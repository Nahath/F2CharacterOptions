; sfall.cfg — additions for f2Mod
; ────────────────────────────────────────────────────────────────────────────
; MERGE these settings into your existing sfall.cfg (or ddraw.ini).
; Do NOT replace the entire file — you will lose your other settings.
;
; If you do not already have a sfall.cfg, rename ddraw.ini to sfall.cfg
; (Sfall 4.x uses sfall.cfg by default) and add the sections below.
; ────────────────────────────────────────────────────────────────────────────

[Scripts]
; ── Global scripts added by f2Mod ──────────────────────────────────────────
;
; If GlobalScriptPaths already exists in your config, APPEND the three paths
; below (comma-separated) to the existing value rather than replacing it.
;
; Example of a merged line if you already had one global script:
;   GlobalScriptPaths=data\scripts\gl_myothermod.int,data\scripts\gl_powerarmor.int,data\scripts\gl_klamath.int,data\scripts\gl_goris_armor.int
;
GlobalScriptPaths=data\scripts\gl_powerarmor.int,data\scripts\gl_klamath.int,data\scripts\gl_goris_armor.int

; ── Hook scripts ───────────────────────────────────────────────────────────
; hs_inventorymove.int and hs_steal.int are picked up automatically by Sfall
; because of their hs_ prefix — no manual registration needed.
